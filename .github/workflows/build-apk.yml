name: Build Arabic Learning APK

on:
  push:
    branches: [ "claude/ui-ux-pro-max-install-bucdzh" ]
    paths:
      - 'arabic-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: arabic-app
        run: npm install

      - name: Sync Capacitor (generates cordova plugin files and copies assets)
        working-directory: arabic-app
        run: npx cap sync android

      - name: Set execute permission on gradlew
        working-directory: arabic-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: arabic-app/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp arabic-app/android/app/build/outputs/apk/debug/app-debug.apk \
             arabic-arabic-learning-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-Learning-APK
          path: arabic-arabic-learning-v1.0.apk
          retention-days: 30

      - name: Show APK info
        run: |
          ls -lh arabic-arabic-learning-v1.0.apk
          echo "✅ APK built successfully!"
          echo "📱 Download from the Actions tab → Artifacts section"
